name: CI-CD - DermaPura na AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: ./dermapura-cicd
          file: ./dermapura-cicd/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dermapura:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dermapura:${{ github.sha }}

      - name: Implantar imagem na EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/dermapura:latest
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE
          script: |
            set -e
            sudo docker pull "$IMAGE"
            sudo docker stop dermapura 2>/dev/null || true
            sudo docker rm dermapura 2>/dev/null || true
            sudo docker run -d \
              --name dermapura \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"
            sudo docker image prune -f
